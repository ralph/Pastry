name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a dry run. Publishes nothing; use a real one to check its changelog notes.'
        required: false
        default: '0.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Pinned to an OS and an Xcode. GitHub retires runner labels, and when
    # this one goes both workflows fail — this one at tag-push time, which is
    # the worst moment to find out. Bump both together, here and in ci.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pinned to a commit, not a tag: this job holds the signing
        # certificate and the notary key, so a third-party action that can
        # move under us is not something to take on trust. v1.7.0.
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4
        with:
          xcode-version: '26'

      # The tag is the version, so the tag and the bundle cannot disagree.
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            # A manual run takes whatever was asked for, so a dry run can be
            # pointed at a real version to check its changelog notes.
            *)  version="${INPUT_VERSION:-0.0.0}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # ci.yml does not run on tags, so without this a tag on a commit with
      # failing tests would cut a release.
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild -project Pastry.xcodeproj -scheme Pastry \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      # A missing certificate is not a failure: the build still runs, so the
      # workflow can be exercised before the secrets exist.
      - name: Import the signing certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CERTIFICATES_P12 secret; building unsigned."
            exit 0
          fi
          # Signing manually without a team fails at codesign rather than
          # degrading, so treat it the same as having no certificate.
          if [ -z "${TEAM_ID}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CERTIFICATES_P12 is set but NOTARY_TEAM_ID is not; building unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          # Recorded before the key goes in, not after the setup succeeds:
          # a failure in between would otherwise leave the cleanup step with
          # nothing to delete and the private key sitting in a keychain.
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Armed before the file exists, so a failed decode or import cannot
          # leave the private key sitting in RUNNER_TEMP.
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Checked before importing, because security's own complaint for a
          # malformed secret is "Unknown format in import", which sounds like
          # the certificate is wrong when the usual cause is a truncated
          # paste. This separates a damaged secret from a wrong password.
          if ! openssl asn1parse -inform DER -in "$RUNNER_TEMP/cert.p12" >/dev/null 2>&1; then
            echo "::error::CERTIFICATES_P12 did not decode to a valid PKCS#12."
            echo "::error::It is usually a truncated paste. Set it from the file instead:"
            echo "::error::  base64 -i YourCert.p12 | gh secret set CERTIFICATES_P12 --repo ralph/Pastry"
            exit 1
          fi
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          args=(-project Pastry.xcodeproj -scheme Pastry -configuration Release
                -destination 'generic/platform=macOS'
                -derivedDataPath build
                MARKETING_VERSION="$VERSION"
                CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}")
          if [ "$SIGNED" = "true" ]; then
            args+=(CODE_SIGN_IDENTITY="Developer ID Application"
                   CODE_SIGN_STYLE=Manual
                   DEVELOPMENT_TEAM="$TEAM_ID"
                   OTHER_CODE_SIGN_FLAGS=--timestamp
                   # Without this Xcode injects com.apple.security.
                   # get-task-allow — the "allow debugging" entitlement —
                   # and Apple rejects the submission for it. archive plus
                   # exportArchive strips it when exporting; a direct build
                   # does not, so it has to be turned off here.
                   CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO)
          else
            args+=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild "${args[@]}" build

      # Five seconds here beats a rejection from Apple ten minutes later.
      # Notarization needs both the hardened runtime (a project setting) and
      # a secure timestamp (a flag above); a regression in either is silent
      # until something checks.
      - name: Check the signature before submitting it
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Pastry.app"
          codesign --verify --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          echo "$details" | grep -E '^(CodeDirectory|Timestamp|Authority)' || true
          if ! echo "$details" | grep -q 'flags=.*runtime'; then
            echo "::error::Hardened runtime is not enabled; Apple will reject this."
            exit 1
          fi
          if ! echo "$details" | grep -q '^Timestamp='; then
            echo "::error::No secure timestamp; Apple will reject this."
            exit 1
          fi
          # The third thing Apple refuses a submission for, and the one that
          # comes back if the build settings drift: a debug entitlement in a
          # distribution build.
          if codesign -d --entitlements - --xml "$app" 2>/dev/null \
               | grep -q 'get-task-allow'; then
            echo "::error::The executable requests com.apple.security.get-task-allow."
            echo "::error::Apple rejects that. CODE_SIGN_INJECT_BASE_ENTITLEMENTS must be NO."
            exit 1
          fi

      - name: Package the DMG
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Pastry.app"
          test -d "$app" || { echo "::error::No app at $app"; exit 1; }
          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging" && mkdir -p "$staging"
          ditto "$app" "$staging/Pastry.app"
          ln -s /Applications "$staging/Applications"
          dmg="Pastry-$VERSION.dmg"
          rm -f "$dmg"
          # hdiutil create is deprecated as of macOS 26 in favour of this,
          # but the replacement is new enough that a runner image might not
          # have it — so try the new one and keep the old as the fallback.
          if ! diskutil image create from "$staging" \
                 --volumeName "Pastry" --format UDZO "$dmg"; then
            echo "::notice::diskutil image create failed; falling back to hdiutil."
            hdiutil create -volname "Pastry" -srcfolder "$staging" \
              -ov -format UDZO "$dmg"
          fi
          test -f "$dmg" || { echo "::error::No DMG was produced"; exit 1; }
          # The disk image is signed too, not just the app inside it: it is
          # what gets downloaded, and what spctl is asked about.
          if [ "$SIGNED" = "true" ]; then
            codesign --sign "Developer ID Application" --timestamp "$dmg"
          fi
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      # notarytool takes a DMG directly, so there is one artifact throughout
      # and no second file that could end up stapled differently.
      - name: Notarize and staple
        id: notarize
        if: steps.signing.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ] || [ -z "${KEY_ID}" ] || [ -z "${ISSUER_ID}" ]; then
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed but the notary secrets are incomplete; skipping notarization."
            exit 0
          fi
          key="$RUNNER_TEMP/key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY" | base64 --decode > "$key"
          # The verdict is read from the status, never from the exit code:
          # notarytool exits 0 whenever it successfully waited, including
          # when Apple's answer is Invalid. Keying off the exit code lets a
          # rejected submission fall through to stapling, which then fails
          # with an unrelated CloudKit error.
          result="$(xcrun notarytool submit "$DMG" --key "$key" --key-id "$KEY_ID" \
                      --issuer "$ISSUER_ID" --wait --timeout 30m --output-format json)"
          id="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          status="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "submission $id -> $status"
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization returned $status. Apple's reasons follow."
            xcrun notarytool log "$id" --key "$key" --key-id "$KEY_ID" \
              --issuer "$ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      # Runs on every build, not only on tags, so a workflow_dispatch run
      # exercises the extraction instead of leaving it untested until a tag.
      - name: Assemble the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          python3 - "$VERSION" CHANGELOG.md > "$notes" <<'PY'
          import re, sys
          version, path = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          # Bounded, so a tag of 1.0 cannot match the heading for 0.1.0.
          pattern = r"(?<![\w.])" + re.escape(version) + r"(?![\w.])"
          for section in re.split(r"^## ", text, flags=re.M)[1:]:
              heading, _, body = section.partition("\n")
              if re.search(pattern, heading):
                  sys.stdout.write(body.strip() + "\n")
                  break
          PY
          if [ ! -s "$notes" ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION; using a bare title."
            printf 'Pastry %s\n' "$VERSION" > "$notes"
          fi
          # The two states that must never be mistaken for a finished build.
          if [ "$SIGNED" != "true" ]; then
            printf '\n---\n\n**Unsigned build** — the signing secrets were not set when this ran, so macOS will refuse to open it.\n' >> "$notes"
          elif [ "$NOTARIZED" != "true" ]; then
            printf '\n---\n\n**Signed but not notarized** — the notary secrets were incomplete, so Gatekeeper will still block this.\n' >> "$notes"
          else
            printf '\n---\n\n**Install:** download `Pastry-%s.dmg`, open it, drag Pastry to Applications. The disk image is signed and notarized, so it opens without a Gatekeeper warning. Pastry is a menu-bar app — it has no Dock icon, and quits from **Quit Pastry** in its menu.\n' "$VERSION" >> "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "--- notes ---"; cat "$notes"

      - name: Publish a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.package.outputs.dmg }}
          NOTES: ${{ steps.notes.outputs.notes }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent for a re-run after a flake, but only while the
          # release is still a draft: once it is published, people may
          # already have the DMG, and replacing it silently would swap what
          # they downloaded for something nobody reviewed.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace it."
              echo "::error::Delete it, or tag a new version."
              exit 1
            fi
            echo "Draft release $TAG exists; replacing the asset."
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$DMG" \
              --title "Pastry $VERSION" --notes-file "$NOTES" --draft
          fi

      # Also kept as an artifact, so a manual run that publishes nothing
      # still leaves something to look at.
      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Pastry-dmg
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error

      # Matters on a self-hosted runner, where the keychain and the user's
      # search list would otherwise outlive the job.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
