name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a dry run. Publishes nothing; use a real one to check its changelog notes.'
        required: false
        default: '0.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Pinned to an OS and an Xcode. GitHub retires runner labels, and when
    # this one goes both workflows fail — this one at tag-push time, which is
    # the worst moment to find out. Bump both together, here and in ci.yml.
    runs-on: macos-26
    # Read by the app-store job below, so the version is worked out once.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pinned to a commit, not a tag: this job holds the signing
        # certificate and the notary key, so a third-party action that can
        # move under us is not something to take on trust. v1.7.0.
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4
        with:
          xcode-version: '26'

      # The tag is the version, so the tag and the bundle cannot disagree.
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            # A manual run takes whatever was asked for, so a dry run can be
            # pointed at a real version to check its changelog notes.
            *)  version="${INPUT_VERSION:-0.0.0}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # ci.yml does not run on tags, so without this a tag on a commit with
      # failing tests would cut a release.
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild -project Pastry.xcodeproj -scheme Pastry \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      # A missing certificate is not a failure: the build still runs, so the
      # workflow can be exercised before the secrets exist.
      - name: Import the signing certificate
        id: keychain
        uses: ./.github/actions/signing-keychain
        with:
          certificates: ${{ secrets.CERTIFICATES_P12 }}
          password: ${{ secrets.CERTIFICATES_PASSWORD }}
          secret-name: CERTIFICATES_P12

      - name: Decide whether to sign
        id: signing
        env:
          IMPORTED: ${{ steps.keychain.outputs.imported }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$IMPORTED" != "true" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CERTIFICATES_P12 secret; building unsigned."
          # Signing manually without a team fails at codesign rather than
          # degrading, so treat it the same as having no certificate.
          elif [ -z "${TEAM_ID}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CERTIFICATES_P12 is set but NOTARY_TEAM_ID is not; building unsigned."
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          args=(-project Pastry.xcodeproj -scheme Pastry -configuration Release
                -destination 'generic/platform=macOS'
                -derivedDataPath build
                MARKETING_VERSION="$VERSION"
                CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}")
          if [ "$SIGNED" = "true" ]; then
            args+=(CODE_SIGN_IDENTITY="Developer ID Application"
                   CODE_SIGN_STYLE=Manual
                   DEVELOPMENT_TEAM="$TEAM_ID"
                   OTHER_CODE_SIGN_FLAGS=--timestamp)
          else
            args+=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild "${args[@]}" build

      # Five seconds here beats a rejection from Apple ten minutes later.
      # Notarization needs both the hardened runtime (a project setting) and
      # a secure timestamp (a flag above); a regression in either is silent
      # until something checks.
      - name: Check the signature before submitting it
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Pastry.app"
          codesign --verify --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          echo "$details" | grep -E '^(CodeDirectory|Timestamp|Authority)' || true
          if ! echo "$details" | grep -q 'flags=.*runtime'; then
            echo "::error::Hardened runtime is not enabled; Apple will reject this."
            exit 1
          fi
          if ! echo "$details" | grep -q '^Timestamp='; then
            echo "::error::No secure timestamp; Apple will reject this."
            exit 1
          fi
          # The third thing Apple refuses a submission for, and the one that
          # comes back if the build settings drift: a debug entitlement in a
          # distribution build.
          if codesign -d --entitlements - --xml "$app" 2>/dev/null \
               | grep -q 'get-task-allow'; then
            echo "::error::The executable requests com.apple.security.get-task-allow."
            echo "::error::Apple rejects that. The project's Release configuration"
            echo "::error::must set CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO."
            exit 1
          fi

      - name: Package the DMG
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Pastry.app"
          test -d "$app" || { echo "::error::No app at $app"; exit 1; }
          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging" && mkdir -p "$staging"
          ditto "$app" "$staging/Pastry.app"
          ln -s /Applications "$staging/Applications"
          dmg="Pastry-$VERSION.dmg"
          rm -f "$dmg"
          # hdiutil create is deprecated as of macOS 26 in favour of this,
          # but the replacement is new enough that a runner image might not
          # have it — so try the new one and keep the old as the fallback.
          if ! diskutil image create from "$staging" \
                 --volumeName "Pastry" --format UDZO "$dmg"; then
            echo "::notice::diskutil image create failed; falling back to hdiutil."
            hdiutil create -volname "Pastry" -srcfolder "$staging" \
              -ov -format UDZO "$dmg"
          fi
          test -f "$dmg" || { echo "::error::No DMG was produced"; exit 1; }
          # The disk image is signed too, not just the app inside it: it is
          # what gets downloaded, and what spctl is asked about.
          if [ "$SIGNED" = "true" ]; then
            codesign --sign "Developer ID Application" --timestamp "$dmg"
          fi
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      # notarytool takes a DMG directly, so there is one artifact throughout
      # and no second file that could end up stapled differently.
      - name: Notarize and staple
        id: notarize
        if: steps.signing.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ] || [ -z "${KEY_ID}" ] || [ -z "${ISSUER_ID}" ]; then
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed but the notary secrets are incomplete; skipping notarization."
            exit 0
          fi
          key="$RUNNER_TEMP/key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY" | base64 --decode > "$key"
          # The verdict is read from the status, never from the exit code:
          # notarytool exits 0 whenever it successfully waited, including
          # when Apple's answer is Invalid. Keying off the exit code lets a
          # rejected submission fall through to stapling, which then fails
          # with an unrelated CloudKit error.
          result="$(xcrun notarytool submit "$DMG" --key "$key" --key-id "$KEY_ID" \
                      --issuer "$ISSUER_ID" --wait --timeout 30m --output-format json)"
          id="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          status="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "submission $id -> $status"
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization returned $status. Apple's reasons follow."
            xcrun notarytool log "$id" --key "$key" --key-id "$KEY_ID" \
              --issuer "$ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      # Runs on every build, not only on tags, so a workflow_dispatch run
      # exercises the extraction instead of leaving it untested until a tag.
      - name: Assemble the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          python3 - "$VERSION" CHANGELOG.md > "$notes" <<'PY'
          import re, sys
          version, path = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          # Bounded, so a tag of 1.0 cannot match the heading for 0.1.0.
          pattern = r"(?<![\w.])" + re.escape(version) + r"(?![\w.])"
          for section in re.split(r"^## ", text, flags=re.M)[1:]:
              heading, _, body = section.partition("\n")
              if re.search(pattern, heading):
                  sys.stdout.write(body.strip() + "\n")
                  break
          PY
          if [ ! -s "$notes" ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION; using a bare title."
            printf 'Pastry %s\n' "$VERSION" > "$notes"
          fi
          # The two states that must never be mistaken for a finished build.
          if [ "$SIGNED" != "true" ]; then
            printf '\n---\n\n**Unsigned build** — the signing secrets were not set when this ran, so macOS will refuse to open it.\n' >> "$notes"
          elif [ "$NOTARIZED" != "true" ]; then
            printf '\n---\n\n**Signed but not notarized** — the notary secrets were incomplete, so Gatekeeper will still block this.\n' >> "$notes"
          else
            printf '\n---\n\n**Install:** download `Pastry-%s.dmg`, open it, drag Pastry to Applications. The disk image is signed and notarized, so it opens without a Gatekeeper warning. Pastry is a menu-bar app — it has no Dock icon, and quits from **Quit Pastry** in its menu.\n' "$VERSION" >> "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "--- notes ---"; cat "$notes"

      - name: Publish a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.package.outputs.dmg }}
          NOTES: ${{ steps.notes.outputs.notes }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent for a re-run after a flake, but only while the
          # release is still a draft: once it is published, people may
          # already have the DMG, and replacing it silently would swap what
          # they downloaded for something nobody reviewed.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace it."
              echo "::error::Delete it, or tag a new version."
              exit 1
            fi
            echo "Draft release $TAG exists; replacing the asset."
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$DMG" \
              --title "Pastry $VERSION" --notes-file "$NOTES" --draft
          fi

      # Also kept as an artifact, so a manual run that publishes nothing
      # still leaves something to look at.
      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Pastry-dmg
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error

      # Matters on a self-hosted runner, where the keychain and the user's
      # search list would otherwise outlive the job.
      - name: Remove the signing keychain
        if: always() && steps.keychain.outputs.keychain != ''
        run: security delete-keychain "${{ steps.keychain.outputs.keychain }}" || true

  # The Mac App Store is a second channel with its own rules: sandboxed,
  # signed with a distribution identity instead of Developer ID, wrapped in a
  # signed installer package, and handed to App Store Connect rather than
  # attached to a GitHub release. Nothing it produces reaches the release, so
  # a failure here cannot spoil the download everyone actually uses.
  #
  # Like the job above it degrades rather than failing when the secrets are
  # absent, so the path can be exercised before any of it is set up.
  app-store:
    # After the Developer ID build, not alongside it. There is no point
    # shipping to the store a build whose own release failed, and an upload
    # burns a build number whether or not Apple accepts it. It is also the
    # only gate on the tests, since ci.yml does not run on tags. The two
    # keychains need no help staying apart — separate jobs, separate VMs —
    # so that is not a reason for this, whatever it looks like.
    #
    # It carries the version too, which is why that is worked out once.
    needs: release
    # Bump with the other two, in this file and in ci.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # v1.7.0, pinned to a commit for the same reason as above: this job
        # holds a distribution certificate and an API key.
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4
        with:
          xcode-version: '26'

      - name: Import the distribution certificates
        id: keychain
        uses: ./.github/actions/signing-keychain
        with:
          certificates: ${{ secrets.APPSTORE_CERTIFICATES_P12 }}
          password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          secret-name: APPSTORE_CERTIFICATES_P12

      - name: Set up store signing
        id: store
        env:
          IMPORTED: ${{ steps.keychain.outputs.imported }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          # A string rather than an array: macOS ships bash 3.2, where
          # ${#array[@]} on an empty array is an unbound variable under
          # set -u — which is exactly the case this has to handle.
          missing=""
          [ "$IMPORTED" = "true" ] || missing="$missing APPSTORE_CERTIFICATES_P12"
          [ -n "${PROFILE}" ] || missing="$missing APPSTORE_PROVISIONING_PROFILE"
          [ -n "${TEAM_ID}" ] || missing="$missing NOTARY_TEAM_ID"
          if [ -n "$missing" ]; then
            # On a tag this is a release that silently does not reach the
            # store, and a green tick nobody will question. Loud instead.
            # Anywhere else it is someone exercising the workflow before
            # the secrets exist, which is what skipping is for.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::Cannot build for the Mac App Store; missing$missing."
              echo "::error::This is a tag, so that would ship a release the store never sees."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping the Mac App Store build; missing$missing."
            exit 0
          fi
          # Whichever the certificate turns out to be. "Apple Distribution"
          # is the modern unified certificate and "3rd Party Mac Developer
          # Application" the older Mac-only one; both are valid for the
          # store, and reading it out of the keychain means either works
          # without the workflow having to know which was created.
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -oE '"(Apple Distribution|3rd Party Mac Developer Application)[^"]*"' \
            | head -1 | tr -d '"' || true)"
          if [ -z "$identity" ]; then
            echo "::error::APPSTORE_CERTIFICATES_P12 carries no Apple Distribution or"
            echo "::error::3rd Party Mac Developer Application identity. It wants the"
            echo "::error::Mac App Distribution certificate, not the Developer ID one."
            exit 1
          fi
          # Read out rather than assumed, for the same reason, and checked
          # here rather than left to exportArchive — which only complains
          # at the end of a ten-minute build, about productbuild, without
          # mentioning the missing certificate.
          installer="$(security find-identity -v "$KEYCHAIN" \
            | grep -oE '"[^"]*(Mac Developer Installer|Mac Installer Distribution)[^"]*"' \
            | head -1 | tr -d '"' || true)"
          if [ -z "$installer" ]; then
            echo "::error::No 3rd Party Mac Developer Installer identity. The store"
            echo "::error::takes a signed installer package, so the .p12 has to hold"
            echo "::error::both certificates."
            exit 1
          fi
          # exportArchive matches on the certificate's own name, so the
          # two *-cert values are the identities with the holder and team
          # cut off. Xcode's "Mac App Distribution" and "Mac Installer
          # Distribution" selectors look like the obvious thing to write
          # instead, and they resolve to nothing against a 3rd Party Mac
          # Developer certificate — which fails the export, after the build.
          {
            echo "identity=$identity"
            echo "app-cert=${identity%%:*}"
            echo "installer-cert=${installer%%:*}"
          } >> "$GITHUB_OUTPUT"
          # Xcode finds a profile by searching this directory, so the file
          # name means nothing to it — a fixed one just stops a re-run on a
          # self-hosted runner from piling up copies.
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          file="$dir/pastry-app-store.provisionprofile"
          printf '%s' "$PROFILE" | base64 --decode > "$file"
          # A profile is CMS-signed, so its contents come out through
          # `security cms` rather than plutil.
          plist="$RUNNER_TEMP/profile.plist"
          if ! security cms -D -i "$file" > "$plist" 2>/dev/null; then
            echo "::error::APPSTORE_PROVISIONING_PROFILE is not a provisioning profile."
            echo "::error::It is usually a truncated paste. Set it from the file:"
            echo "::error::  base64 -i Pastry.provisionprofile | gh secret set APPSTORE_PROVISIONING_PROFILE --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
          echo "profile-name=$name" >> "$GITHUB_OUTPUT"
          echo "Signing as $identity under profile \"$name\""
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Archive for the store
        if: steps.store.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          IDENTITY: ${{ steps.store.outputs.identity }}
          PROFILE_NAME: ${{ steps.store.outputs.profile-name }}
        run: |
          set -euo pipefail
          # The build number has to rise with every upload of a given
          # version, and it is the same one the DMG in this run carries.
          # The run attempt is in it because the run number is not: it
          # stays put when you press "Re-run failed jobs", so without it
          # every retry after a part-finished upload would be refused as a
          # build number Apple has already seen.
          xcodebuild archive \
            -project Pastry.xcodeproj -scheme Pastry -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Pastry.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            CODE_SIGN_ENTITLEMENTS=Pastry/Pastry-AppStore.entitlements

      # Five seconds here beats a rejection from Apple, same as the DMG
      # job's check — but it matters more, because the next step may hand
      # this to App Store Connect, which burns the build number whether or
      # not Apple likes what it gets.
      - name: Check the archive before exporting it
        if: steps.store.outputs.ready == 'true'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Pastry.xcarchive/Products/Applications/Pastry.app"
          test -d "$app" || { echo "::error::No app in the archive at $app"; exit 1; }
          codesign --verify --strict --verbose=2 "$app"
          entitlements="$(codesign -d --entitlements - --xml "$app" 2>/dev/null || true)"
          if ! printf '%s' "$entitlements" | grep -q 'com.apple.security.app-sandbox'; then
            echo "::error::The app is not sandboxed, so the store will reject it."
            echo "::error::CODE_SIGN_ENTITLEMENTS did not take."
            exit 1
          fi
          if printf '%s' "$entitlements" | grep -q 'get-task-allow'; then
            echo "::error::The executable requests com.apple.security.get-task-allow."
            echo "::error::Apple rejects that. The project's Release configuration"
            echo "::error::must set CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO."
            exit 1
          fi
          test -f "$app/Contents/embedded.provisionprofile" || {
            echo "::error::No embedded provisioning profile; the store will refuse this."
            exit 1
          }

      # Exporting and uploading are two steps, not one exportArchive with
      # `destination: upload`, for two reasons. The package reaches the
      # artifact store before anything is sent to Apple, so a rejected
      # upload leaves something to look at. And Xcode describes the
      # destination as "exported locally *or* uploaded", so an upload may
      # well leave no local package — which a combined step would have to
      # either tolerate or mistake for a failed export.
      - name: Export the package
        id: export
        if: steps.store.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PROFILE_NAME: ${{ steps.store.outputs.profile-name }}
          APP_CERT: ${{ steps.store.outputs.app-cert }}
          INSTALLER_CERT: ${{ steps.store.outputs.installer-cert }}
        run: |
          set -euo pipefail
          # Written by plistlib rather than a heredoc: these values are
          # certificate and profile names, and one holder called
          # "Smith & Sons" would produce XML that does not parse, failing
          # the export after the archive has already been built.
          python3 - "$RUNNER_TEMP/export.plist" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], "wb") as f:
              plistlib.dump({
                  "method": "app-store-connect",
                  "destination": "export",
                  "teamID": os.environ["TEAM_ID"],
                  "signingStyle": "manual",
                  # Read off the keychain, so whichever of the valid
                  # distribution certificates exists is the one used.
                  "signingCertificate": os.environ["APP_CERT"],
                  "installerSigningCertificate": os.environ["INSTALLER_CERT"],
                  "provisioningProfiles": {
                      "de.rvdh.Pastry": os.environ["PROFILE_NAME"],
                  },
                  # Otherwise Xcode rewrites the build number to whatever
                  # App Store Connect last saw.
                  "manageAppVersionAndBuildNumber": False,
              }, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pastry.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"
          built="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.pkg' | head -1 || true)"
          if [ -z "$built" ]; then
            echo "::error::exportArchive produced no installer package."
            exit 1
          fi
          pkg="Pastry-$VERSION.pkg"
          cp "$built" "$pkg"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      # Before the upload, and with always(), so the package survives a
      # rejection — which is the only time anyone wants to look at it.
      # Not attached to the release: it is not something to download and
      # run by hand.
      - name: Keep the package
        if: always() && steps.export.outputs.pkg != ''
        uses: actions/upload-artifact@v4
        with:
          name: Pastry-pkg
          path: ${{ steps.export.outputs.pkg }}
          if-no-files-found: error

      # Only a tag ships. A manual run stops at the step above, having
      # exercised the whole path — archive, sandbox, installer, export —
      # without putting a build nobody asked for in front of Apple.
      - name: Upload to App Store Connect
        if: steps.export.outputs.pkg != '' && github.ref_type == 'tag'
        env:
          PKG: ${{ steps.export.outputs.pkg }}
          KEY: ${{ secrets.NOTARY_KEY }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ] || [ -z "${KEY_ID}" ] || [ -z "${ISSUER_ID}" ]; then
            echo "::error::The App Store Connect API key secrets are incomplete,"
            echo "::error::so this tag cannot reach the store. The package is"
            echo "::error::attached to this run as an artifact."
            exit 1
          fi
          # The same archive and the same options, flipped to upload. The
          # package this re-exports is byte-for-byte equivalent to the
          # artifact above, but freshly signed, so the two differ in their
          # signature timestamps — the artifact is for looking at, not for
          # shipping.
          cp "$RUNNER_TEMP/export.plist" "$RUNNER_TEMP/upload.plist"
          /usr/libexec/PlistBuddy -c "Set :destination upload" "$RUNNER_TEMP/upload.plist"
          key="$RUNNER_TEMP/asc-key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY" | base64 --decode > "$key"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pastry.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "::notice::Uploaded $PKG (build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}) to App Store Connect."
          echo "::notice::It still has to be attached to a version and submitted there."

      # Unconditional: rm -f on a profile that was never written is a
      # no-op, and that is cheaper than an output threading a constant
      # path across forty lines to drive an `if`.
      - name: Remove the provisioning profile
        if: always()
        run: rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/pastry-app-store.provisionprofile"

      - name: Remove the signing keychain
        if: always() && steps.keychain.outputs.keychain != ''
        run: security delete-keychain "${{ steps.keychain.outputs.keychain }}" || true
