name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Bump together with release.yml when GitHub retires the label.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pinned to a commit for the same reason release.yml is. v1.7.0.
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4
        with:
          xcode-version: '26'

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep macosx

      - name: Build
        run: |
          xcodebuild -project Pastry.xcodeproj -scheme Pastry \
            -configuration Debug build-for-testing CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild -project Pastry.xcodeproj -scheme Pastry \
            -configuration Debug test-without-building CODE_SIGNING_ALLOWED=NO
